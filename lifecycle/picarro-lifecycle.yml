versioning:
  scheme: protobuf-api-level
  detail: >-
    Each service .proto embeds APILEVEL_MAJOR / APILEVEL_MINOR / APILEVEL_PATCH enumerated
    values that peers use to construct their API version, indicating which version of the
    interface file they were built against. `get_service_info` returns a ServiceInfo with
    the server name and API version so a client can compare at runtime.
  semantics:
    major: increment if breaking changes are introduced
    minor: increment for backwards compatible interface changes
    patch: increment when a change is backwards and forwards compatible
    tweak: APILEVEL_TWEAK is marked Deprecated in foup.proto
  current_api_level: '1.0.0'
  current_release: 'FOUP v6.1 (packages 6.1.0-5; Python wheels 5.0.0)'
  docs: https://github.com/picarro/sam-foup-public
