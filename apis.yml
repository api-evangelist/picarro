- name: Picarro P-Cubed Platform
  description: >-
    P-Cubed is Picarro's cloud data processing and storage platform. Picarro analyzers
    stream or batch data to it, customers interact with the results in a graphics-rich web
    environment, and — per Picarro's own product literature — customers can create their
    own customized data transformation routines through the P-Cubed application
    programming interface, alongside proprietary Picarro algorithms. The P-Cubed Mobile
    App (launched October 2025) pairs with the Picarro Handheld and transmits readings to
    the P-Cubed Cloud. No public specification, developer portal, or API reference for the
    P-Cubed API was found; access is gated behind customer SSO.
  humanURL: https://www.picarro.com/gas/P-Cubed_Mobile
  baseURL: https://pcubed.picarro.com
  x-contract-status: no-public-specification
  x-contract-note: >-
    Probed 2026-08-02 — /openapi.json, /openapi.yaml, /swagger.json, /api/openapi.json,
    /api/swagger.json, /swagger-ui.html, /api/v1 and /.well-known/* all returned 404 or an
    unauthenticated redirect to the Keycloak SAML endpoint. The API is documented only in
    Picarro sales literature.
  tags: [Analytics, Cloud, Data Processing, Methane, Utilities]
