- name: Picarro Platform Server API
  description: >-
    The gRPC interface to the host computer underneath a Picarro SAM deployment.
    `platformserver` exposes NetConfig for network connectivity and Wi-Fi management,
    SysConfig for product/version information, host name, time and timezone configuration
    and command invocation, VirtualFileSystem for downloading logs and uploading upgrade
    packages, and Upgrade for scanning for and installing Picarro .picpac release
    packages. Interface definitions and Python clients are published on GitHub.
  humanURL: https://github.com/picarro/sam-foup-public
  baseURL: grpc://localhost:7528
  x-deployment: on-premise-edge
  x-deployment-note: >-
    platformserver accepts plaintext gRPC on TCP 7528 (P-L-A-T) on the customer's own
    host. There is no Picarro-hosted endpoint.
  tags: [gRPC, Protobuf, System Management, Device Management]
  properties:
  - type: Protobuf
    url: grpc/picarro-sam-foup-netconfig.proto
    name: NetConfig service
  - type: Protobuf
    url: grpc/picarro-sam-foup-sysconfig.proto
