apis:
- name: Picarro Edge — SAM FOUP gRPC API
  description: >-
    The first-party gRPC/ProtoBuf interface Picarro publishes for external access to
    Picarro SAM (semiconductor airborne molecular contamination) systems. The
    `picarro-edge` server exposes three services — FOUP for starting, aborting and
    retrieving FOUP measurement jobs, MeasurementSet for managing which compounds are
    measured, and Controller for streaming instrument health alerts. Every service also
    exposes a server-streaming `watch()` signal feed that acts as a pub/sub event channel.
    Interface definitions, Python client wheels, Debian packages and command-line tools
    are published openly on GitHub.
  humanURL: https://github.com/picarro/sam-foup-public
  baseURL: grpc://localhost:3343
  x-deployment: on-premise-edge
  x-deployment-note: >-
    picarro-edge runs on the customer's own instrument network and accepts plaintext gRPC
    on TCP 3343 (E-D-G-E). There is no Picarro-hosted endpoint; clients pass
    --host=ADDRESS to reach a specific instrument. The base URL above is the documented
    default, not a public service.
  tags:
  - gRPC
  - Protobuf
  - Semiconductors
  - Gas Detection
  - Event
  tags_raw:
  - gRPC
  - Protobuf
  - Semiconductor
  - Gas Detection
  - Events
