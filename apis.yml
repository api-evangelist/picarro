x-enrichment-notes:
  pointers_deliberately_withheld:
  - type: Idempotency
    reason: >-
      Picarro documents no idempotency key or de-duplication contract anywhere in the
      .proto files or the README. start_job is explicitly not safe to retry. Recorded as
      supported:false in conventions/picarro-conventions.yml.
  - type: Security
    reason: >-
      No RFC 9116 security.txt, no responsible-disclosure policy, no bug bounty on
      HackerOne/Bugcrowd/Intigriti and no security@ address were found on any Picarro host
      (all probed 2026-08-02, all 404). No vulnerability-disclosure artifact was written.
  - type: Deprecation
    reason: >-
      No written deprecation or sunset policy is published. The only deprecation signal is
      the field-level "// Deprecated" annotation on APILEVEL_TWEAK in foup.proto.
  - type: MCPServer
    reason: >-
      Picarro hosts no MCP server. mcp/picarro-mcp.yml is an API Evangelist design
      candidate derived from the published gRPC contract, marked status:candidate; wiring
      the canonical pointer would credit Picarro with an agent surface it does not operate.
  - type: AgentCard
    reason: >-
      /.well-known/agent-card.json and /.well-known/agent.json were probed on every
      Picarro host. www and pcubed returned 404; trust, status and fenceline returned
      HTML SPA catch-alls, which were rejected. No a2a/ artifact was written.
  - type: Webhooks
    reason: >-
      Picarro ships no webhooks. Its event surface is gRPC server streaming (watch()
      signal feeds), described in the derived AsyncAPI document.
  - type: Postman
    reason: >-
      Public Postman search returns only an unaffiliated empty personal team
      ("ywu-picarro's Team", 0 collections). No official Picarro collection or workspace.
  - type: Roadmap
    reason: No public roadmap page was found.
