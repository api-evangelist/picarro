aid: picarro
name: Picarro
description: >-
  Picarro, Inc. is a Santa Clara, California company that builds high-precision gas
  concentration and stable-isotope analyzers based on Cavity Ring-Down Spectroscopy
  (CRDS), together with the cloud software and mobile platforms that turn those
  measurements into operational decisions. Its instruments measure more than 700
  compounds — methane, ethane, CO2, N2O, ammonia, ethylene oxide, hydrogen peroxide,
  water isotopes and cleanroom-level airborne molecular contamination — at parts-per-
  billion and parts-per-trillion sensitivity. Picarro serves natural gas utilities
  (mobile methane leak detection and the Picarro Surveyor programme), sterilization and
  EtO facilities, refinery and chemical-plant fenceline monitoring, semiconductor
  cleanrooms and FOUP contamination control, pharmaceutical manufacturing, and
  atmospheric and earth-science research. The company reports 25+ years of operation,
  5,000+ instruments installed in about 100 countries, and 77 patents. Its software side
  is P-Cubed, a cloud data-processing and storage platform with a customer-facing API for
  custom data transformation routines, a companion mobile app for field leak
  investigations, and — for semiconductor deployments — a publicly published gRPC/ProtoBuf
  interface (picarro/sam-foup-public) for external control and monitoring of Picarro Edge
  systems.
