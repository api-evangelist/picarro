pointer_note: 'NO `type: MCPServer` pointer is wired in apis.yml for this file. Picarro hosts no MCP server;
  this document is an API Evangelist design candidate derived from Picarro''s own published gRPC contract,
  not a provider capability. Wiring the canonical pointer would credit Picarro with an agent surface it
  does not operate.'
server:
  name: picarro-edge
  transport: stdio
  url: null
  backing_surface: gRPC — picarro-edge on TCP 3343, platformserver on TCP 7528
  note: Because the Picarro Edge servers run on the customer's own instrument network with plaintext gRPC
    and no per-call credential, a realistic MCP server would be a local stdio bridge that the operator
    points at a specific --host, not a Picarro-hosted remote server.
safety_note: Several of these operations are physically consequential — start_job and abort_job drive
  a measurement on real semiconductor cleanroom hardware, sync_measurement_sets can delete configuration,
  install/finalize upgrade firmware, and reboot restarts the host. Any MCP exposure should keep the write
  and control tools behind explicit human confirmation.
